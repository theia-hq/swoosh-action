# The flagship Action: expose a GitHub runner's shell over the theia overlay, with no SSH keys to manage.
# `uses: theia-hq/swoosh-action@v2` in any workflow, then `swoosh ssh me/<label>` into the runner.
# The shell is a keyless SSH server (the sshh crate): it has no ssh keys of its own. What authorizes a
# session is MEMBERSHIP: the runner adopts your signet, so its family gate admits your devices, and you
# dial with a badge your key self-signs. That capability IS the authentication.
name: swoosh-ssh
description: Expose this runner as a theia node (keyless shell + ping/speed by default, more on request) over the overlay, reachable by membership across GitHub's NAT.

inputs:
  authkey:
    description: >
      A one-time authkey minted on your laptop (`swoosh mint <label>`). The runner ADOPTS it to become that
      derived device identity AND to trust your signet, so your family gate admits you by membership, with
      no per-key allowlist. A SECRET (it carries the device seed): pass a GitHub secret.
    required: true
  services:
    description: >
      the services to expose, space-separated `name=addr` (see `swoosh serve`). Defaults to a full node:
      a keyless shell plus `ping=ping:`/`speed=speed:` diagnostics (`ssh=sshd: ping=ping: speed=speed:`).
      Add `fetch=fetch:` for HTTP egress you can `swoosh
      fetch --via` through, `web=127.0.0.1:8080` to forward a local port, `sock=unix:/path` for a unix
      socket, all behind the same family gate. Every entry must be `name=addr`: a bare `ping` or `ping:`
      is refused.
    required: false
    default: "ssh=sshd: ping=ping: speed=speed:"
  minutes:
    description: >
      hold the job open this many minutes so the node stays reachable for external or interactive use (ssh
      in, do your thing, then it stops). OMIT to run non-blocking: the node serves in the background and the
      workflow ADVANCES to your next steps, staying reachable until the job ends (the tailscale shape). End a
      hold early with `swoosh stop --at me/<label>` from your laptop.
    required: false
    default: ""
  version:
    # FLAG(CLI-Architect): input name `version`, values `latest` or a release tag, default `latest`.
    description: >
      the swoosh release to install: `latest` (the newest release) or a pinned release tag (e.g. `v2`).
      Pin for reproducible runs; `latest` for always-current.
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: install swoosh (checksum + provenance verified)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SWOOSH_REF: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # The runner needs only swoosh now: it `adopt`s the authkey AND serves the services (`swoosh
        # serve`), one binary, no `tightbeam` on PATH. Verify BOTH a checksum and the keyless build-provenance
        # attestation before the binary ever runs: `gh attestation verify` proves it was built by theia-hq's
        # release workflow (sigstore/OIDC), so a swapped release binary is refused. Never `curl | sudo` blind.
        # `latest` installs the newest release; a pinned tag installs that tag for reproducible runs.
        os=$(uname -s | tr '[:upper:]' '[:lower:]'); case "$os" in darwin) os=macos ;; esac
        arch=$(uname -m); case "$arch" in amd64|x86_64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
        asset="swoosh-$arch-$os"
        if [ "$SWOOSH_REF" = "latest" ]; then
          base="https://github.com/theia-hq/swoosh/releases/latest/download"
        else
          base="https://github.com/theia-hq/swoosh/releases/download/$SWOOSH_REF"
        fi
        curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/swoosh"
        curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/swoosh.sha256"
        echo "$(cat "$RUNNER_TEMP/swoosh.sha256")  $RUNNER_TEMP/swoosh" | shasum -a 256 -c -
        gh attestation verify "$RUNNER_TEMP/swoosh" --repo theia-hq/swoosh
        sudo install -m 0755 "$RUNNER_TEMP/swoosh" /usr/local/bin/swoosh

    - name: adopt your signet and serve the services (family-gated)
      shell: bash
      env:
        SWOOSH_AUTHKEY: ${{ inputs.authkey }}
        THEIA_SERVICES: ${{ inputs.services }}
      run: |
        set -euo pipefail
        # Adopt the authkey off argv: `swoosh adopt -` reads stdin, so the secret never appears in `ps` or
        # `/proc/<pid>/cmdline`. (`adopt` also accepts `@<path>` for a file; `SWOOSH_AUTHKEY` is the same
        # value, taken verbatim, for callers who prefer the environment.)
        # FLAG(Adversary): the stdin pipe closes the argv leak but the secret still rides the `SWOOSH_AUTHKEY`
        # env var into this step (visible in /proc/<pid>/environ to co-tenants, inherited by spawned
        # children). Matches what `swoosh adopt` documents for the env form; a file (`@<path>`) input is
        # the further close if wanted.
        printf '%s' "$SWOOSH_AUTHKEY" | swoosh adopt -
        # Serve the requested services behind the DEFAULT family gate (rooted at the adopted signet): only
        # your devices and delegates can reach any of them, no per-key allowlist, and no --public (serve
        # refuses --public for sshd:, a keyless shell has no legitimate public use). --quiet: the readiness
        # banner (node id, services, gate) is NEVER printed, so it cannot leak into the (public) log. Serves
        # over iroh, reachable by key across the NAT.
        read -ra SERVICES <<< "$THEIA_SERVICES"
        swoosh serve "${SERVICES[@]}" --quiet 2> "$RUNNER_TEMP/expose.err" &
        echo $! > "$RUNNER_TEMP/expose.pid"
        # Fail fast: give serve a moment, then verify it is alive, so a dead node (bad authkey, gate, port)
        # surfaces HERE with the key redacted, not silently in a later step. The serve is backgrounded, so it
        # persists past this step; a `minutes` hold below monitors it, and without one the job's own next
        # steps run against a reachable node until the job ends (the non-blocking, tailscale-shaped default).
        sleep 2
        if ! kill -0 "$(cat "$RUNNER_TEMP/expose.pid")" 2>/dev/null; then
          echo "::error::swoosh serve exited immediately." >&2
          sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
          exit 1
        fi
        echo "node reachable over the overlay by key. from your laptop: swoosh ssh me/<label> (or ping/speed/fetch)."

    # Only when `minutes` is set: hold the job open so the node stays reachable for external or interactive
    # use. Omitted, the action is non-blocking (the tailscale shape): the workflow advances to your next
    # steps and the node stays up until the job ends.
    - name: hold the job open for interactive use
      if: ${{ inputs.minutes != '' }}
      shell: bash
      env:
        MINUTES: ${{ inputs.minutes }}
      run: |
        set -uo pipefail
        pid=$(cat "$RUNNER_TEMP/expose.pid")
        deadline=$(( SECONDS + MINUTES * 60 ))
        echo "holding open for ${MINUTES}m. early release: swoosh stop --at me/<label> from your laptop."
        while [ "$SECONDS" -lt "$deadline" ]; do
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          sleep 5
        done
        # Deadline expiry with a live pid: stop the node locally first, then reap. Early remote stop
        # already killed the pid, so this kill is a no-op via || true and wait returns its code.
        kill "$pid" 2>/dev/null || true
        wait "$pid" 2>/dev/null
        code=$?
        if [ "$code" -ne 0 ]; then
          echo "::error::the node exited before the hold ended." >&2
          sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
          exit "$code"
        fi
        echo "released early."
