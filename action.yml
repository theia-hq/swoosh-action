# The flagship Action: expose a GitHub runner as a theia node over the overlay, with no SSH keys to manage.
# `uses: theia-hq/swoosh-action@v2` in any workflow, with the authkey secret, and `swoosh ssh me/<label>`
# reaches the runner. The shell is a keyless SSH server (the sshh crate): it has no ssh keys of its own.
# What authorizes a session is MEMBERSHIP: the runner adopts your signet, so its family gate admits your
# devices, and you dial with a badge your key self-signs. That capability IS the authentication. WITHOUT an
# authkey the runner is SELF-ROOTED instead: it mints its own key and trusts only that key, so no device
# reaches it by membership; a later step mints and publishes a capability link rooted on the runner itself.
name: swoosh-ssh
description: Expose this runner as a theia node (keyless shell + ping/speed by default, more on request) over the overlay, reachable by membership across GitHub's NAT, or self-rooted with a capability link when no authkey is set.

inputs:
  authkey:
    description: >
      A one-time invite for this runner (`swoosh invite add <label>` on your machine), passed as a GitHub
      secret. The derived form carries the device seed: the runner adopts it to become that identity AND to
      trust your signet, so the gate admits your devices by membership, with no per-key allowlist. A bound
      invite (`swoosh invite add <label> --for <key>`) carries no seed and keeps the runner's identity.
      OMIT for a self-rooted node: the runner mints its own key, trusts only that key, and is reached by a
      capability link a later step mints and publishes.
    required: false
    default: ""
  services:
    description: >
      the services to expose, space-separated `name=target` (see `swoosh serve`). Defaults to a full node:
      a keyless shell plus `ping=ping:`/`speed=speed:` diagnostics (`ssh=sshd: ping=ping: speed=speed:`).
      Add `fetch=fetch:` for HTTP egress you can `swoosh
      fetch --via` through, `web=127.0.0.1:8080` to forward a local port, `sock=unix:/path` for a unix
      socket, all behind the same family gate. Every entry must be `name=target`: a bare `ping` or `ping:`
      is refused.
    required: false
    default: "ssh=sshd: ping=ping: speed=speed:"
  public:
    description: >
      open named services to anyone, unauthenticated (a comma-list, exactly as `swoosh serve --public`
      takes it; e.g. `ping,speed`). Empty by default: every service stays behind your gate. The eligible
      set is exactly a `ping=ping:`, `speed=speed:`, or `fetch=fetch:<origin>` service: each public name
      must be bound to its matching built-in target in `services`. Any other shape, including a forward,
      `echo`, a raw stream, a `--public-unsafe` shape, a name bound to another target, or a name you do
      not serve, is refused before serve runs. The node enforces `fetch`'s origin scope.
    required: false
    default: ""
  expires:
    description: >
      bound the node's life with a duration (`30m`, `2h`, `1d`, exactly as `swoosh serve --expires`
      parses). When set, the step runs serve in the foreground and lives exactly as long as the node: at
      the deadline, or on a remote `swoosh stop`, the node ends gracefully and the step passes; a real
      serve failure fails the step with the redacted stderr. OMIT to return as soon as the node is up: the
      node keeps serving until the job ends and the workflow advances. Refused without an authkey: a
      self-rooted node is reached by a capability link that later steps must mint and publish, and a step
      held open blocks them.
    required: false
    default: ""
  version:
    # FLAG(CLI-Architect): input name `version`, values `latest` or a release tag, default `latest`.
    description: >
      the swoosh release to install: `latest` (the newest release) or a pinned release tag (e.g. `v0.8.0`).
      Pin for reproducible runs; `latest` for always-current.
    required: false
    default: "latest"

outputs:
  node-id:
    description: >
      The node's public key (`bf01...`), the address peers dial. In adopt mode the adopted device's key;
      with no authkey, the key the runner just minted. Public, not a secret: reaching anything still needs
      a badge or a capability link.
    value: ${{ steps.node.outputs['node-id'] }}
  services:
    description: >
      The services the node serves, space-separated `name=target`, exactly as passed to `serve` (the input,
      or its default).
    value: ${{ steps.node.outputs.services }}

runs:
  using: composite
  steps:
    - name: install swoosh (checksum + provenance verified)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SWOOSH_REF: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # The runner needs only swoosh now: it `adopt`s an authkey or self-roots AND serves the services
        # (`swoosh serve`), one binary, no `tightbeam` on PATH. Verify BOTH a checksum and the keyless
        # build-provenance attestation before the binary ever runs: `gh attestation verify` proves it was
        # built by theia-hq's release workflow (sigstore/OIDC), so a swapped release binary is refused.
        # Never `curl | sudo` blind. `latest` installs the newest release; a pinned tag installs that tag
        # for reproducible runs.
        os=$(uname -s | tr '[:upper:]' '[:lower:]'); case "$os" in darwin) os=macos ;; esac
        arch=$(uname -m); case "$arch" in amd64|x86_64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
        asset="swoosh-$arch-$os"
        if [ "$SWOOSH_REF" = "latest" ]; then
          base="https://github.com/theia-hq/swoosh/releases/latest/download"
        else
          base="https://github.com/theia-hq/swoosh/releases/download/$SWOOSH_REF"
        fi
        curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/swoosh"
        curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/swoosh.sha256"
        echo "$(cat "$RUNNER_TEMP/swoosh.sha256")  $RUNNER_TEMP/swoosh" | shasum -a 256 -c -
        gh attestation verify "$RUNNER_TEMP/swoosh" --repo theia-hq/swoosh
        sudo install -m 0755 "$RUNNER_TEMP/swoosh" /usr/local/bin/swoosh

    - name: adopt or self-root, serve the services, hold for expires (gated)
      id: node
      shell: bash
      env:
        SWOOSH_AUTHKEY: ${{ inputs.authkey }}
        THEIA_SERVICES: ${{ inputs.services }}
        THEIA_PUBLIC: ${{ inputs.public }}
        EXPIRES: ${{ inputs.expires }}
        # Pin every child of this step to errors only. The default filter surfaces the recv activity line,
        # and the failure paths below republish this step's stderr (expose.err) to the public log; the pin
        # keeps peer-influenced activity out of that echo and refuses a RUST_LOG=debug inherited from the
        # workflow, so the echo cannot widen.
        RUST_LOG: error
      run: |
        set -euo pipefail
        # expose.err is per-INVOCATION, not per-job: RUNNER_TEMP persists on a self-hosted runner, and the
        # file holds serve's diagnostics until they are read. Remove it on EVERY exit path (clean, failure,
        # or the step ending over a backgrounded serve), so no arrival record survives the step. A
        # backgrounded serve keeps its open fd; the path is unlinked, not left behind.
        trap 'rm -f "$RUNNER_TEMP/expose.err"' EXIT
        # Two modes, chosen by the authkey. SET: adopt it over stdin, so a derived invite's seed never
        # enters argv (`ps` sees only `adopt -` and the flag) and never touches disk; the runner delivers
        # inputs as env (unavoidable), and `adopt` is the one child that holds it, only long enough to
        # consume it. Unset it the moment adopt returns, before any other process spawns (notably `swoosh
        # serve`), so children never inherit it. EMPTY: self-rooted, no adopt: the node mints its own key
        # and gates on it.
        SELF_ROOTED=false
        if [ -n "$SWOOSH_AUTHKEY" ]; then
          # --force: the operator re-provisions a persistent runner per job by minting a fresh invite, so
          # the carried badge differs from the one the last job stored in the default home, and adopt's
          # guard would refuse the replacement. That guard exists to stop a SILENT swap of the live
          # credential (a replayed old or revoked token), not the operator's deliberate re-provisioning;
          # --force is that acknowledgement. A rerun of the same invite is byte-identical and needs no
          # flag; --force also waives the differing-signet refusal, for the same operator-chosen reason.
          printf '%s' "$SWOOSH_AUTHKEY" | swoosh adopt - --force
          unset SWOOSH_AUTHKEY
        else
          SELF_ROOTED=true
          echo "::warning::no authkey: self-rooted mode; this node trusts only its own root, so your devices will not reach it. Set the authkey secret to adopt."
          if [ -n "$EXPIRES" ]; then
            # A self-rooted node's only reach is a capability link minted and published by a LATER step.
            # `expires` keeps THIS step alive until the node is gone, so those steps never run; teach the
            # working shape instead of holding a node nobody can reach. Checked before the home is set up so
            # a refused run does not touch the job's environment.
            echo "::error::expires cannot be combined with an empty authkey: a self-rooted node is reached by a capability link that later steps must mint and publish, and expires holds this step until the node is gone. Run without expires, mint and publish in later steps, then keep the job alive with a final step."
            exit 1
          fi
          # A fresh per-job home. `serve` persists its identity in the node home, and on a self-hosted
          # runner the default home may still hold an earlier job's (or an adopted) identity, which serve
          # would then gate on instead of itself. `SWOOSH_HOME` moves the whole node (key, signet,
          # contacts) to a new dir under RUNNER_TEMP; exporting it through $GITHUB_ENV lets a later step's
          # `swoosh grant issue` mint from the SAME root. The rm -rf is what makes it FRESH even when
          # RUNNER_TEMP itself persists.
          SWOOSH_HOME="$RUNNER_TEMP/swoosh-home"
          rm -rf -- "$SWOOSH_HOME"
          export SWOOSH_HOME
          echo "SWOOSH_HOME=$SWOOSH_HOME" >> "$GITHUB_ENV"
        fi
        # `swoosh identity` prints the NodeId first (minting the key when the home has none), the full
        # public key a peer dials; in adopt mode it prints the adopted device's key. Captured before
        # `serve` binds, so both outputs are settled while the identity is.
        identity_out=$(swoosh identity)
        NODE_ID=$(printf '%s\n' "$identity_out" | sed -n '1p')
        read -ra SERVICES <<< "$THEIA_SERVICES"
        # The action-side half of the eligible-set guard: the exclusion lives in the input parse, so
        # manual `serve --public` semantics stay untouched. Split on commas only; no trimming, so a token
        # is compared exactly as typed (` speed` is not `speed`). A public name must be ping, speed, or
        # fetch AND bound to its matching target in services (`ping=ping:`, `speed=speed:`, or
        # `fetch=fetch:<origin>`), so an alias (`fetch=127.0.0.1:8080`) or a forward cannot ride a built-in
        # name. The node's own bind proof still backstops the target level.
        PUBLIC_RULE="The eligible set is exactly ping=ping:, speed=speed:, and fetch=fetch:<origin>; forwards, echo, raw streams, and --public-unsafe are never eligible."
        if [ -n "$THEIA_PUBLIC" ]; then
          # A block-scalar list can hide names past the first line; refuse it here, not at serve.
          case "$THEIA_PUBLIC" in
            *$'\n'*)
              echo "::error::public: the list must be one line; a newline is not allowed."
              exit 1
              ;;
          esac
          IFS=',' read -ra PUBLIC_NAMES <<< "$THEIA_PUBLIC"
          for name in "${PUBLIC_NAMES[@]}"; do
            case "$name" in
              ping|speed|fetch) ;;
              *)
                echo "::error::public: '$name' is not eligible. $PUBLIC_RULE"
                exit 1
                ;;
            esac
            entry= target=
            for candidate in "${SERVICES[@]}"; do
              case "$candidate" in
                "$name"=*)
                  entry="$candidate"
                  target="${candidate#*=}"
                  break
                  ;;
              esac
            done
            if [ -z "$entry" ]; then
              echo "::error::public: '$name' is not served: no '$name=<target>' entry in services. $PUBLIC_RULE"
              exit 1
            fi
            case "$target" in
              "$name":*) ;;
              *)
                echo "::error::public: '$name' is bound to '$target', not to '$name:'. $PUBLIC_RULE"
                exit 1
                ;;
            esac
          done
        fi
        # Serve the requested services behind the node's gate (the adopted signet, or the node's own key
        # in self-rooted mode): no per-key allowlist. --quiet: the readiness banner (node id, services,
        # gate) is NEVER printed, so it cannot leak into the (public) log; serve stderr is held in a file
        # so a failure echoes with every `bf01...` redacted.
        SERVE_ARGS=("${SERVICES[@]}" --quiet)
        if [ -n "$THEIA_PUBLIC" ]; then
          # Verbatim passthrough, one argv: every token was proven above, and serve splits on commas.
          SERVE_ARGS+=(--public "$THEIA_PUBLIC")
        fi
        if [ -n "$EXPIRES" ]; then
          # expires: serve in the FOREGROUND, so this step lives exactly as long as the node. `--expires`
          # is a local timer with no security surface: at the deadline the node shuts down gracefully (the
          # same stop a remote `swoosh stop` gives) and serve exits 0, so both clean ends pass the step. A
          # nonzero exit is a real failure; print the redacted stderr and fail with serve's code. On a
          # clean exit the node did come up (only a bound node can be stopped), so settle both outputs
          # before the step ends and never emit them for a node that never served.
          code=0
          swoosh serve "${SERVE_ARGS[@]}" --expires "$EXPIRES" 2> "$RUNNER_TEMP/expose.err" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::swoosh serve exited $code." >&2
            sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
            exit "$code"
          fi
          {
            echo "node-id=$NODE_ID"
            echo "services=$THEIA_SERVICES"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        swoosh serve "${SERVE_ARGS[@]}" 2> "$RUNNER_TEMP/expose.err" &
        pid=$!
        # Fail fast: give serve a moment, then verify it is alive, so a dead node (bad authkey, gate, port)
        # surfaces HERE with the key redacted, not silently later. Without expires the step ends after the
        # check and the backgrounded serve persists for the rest of the job.
        sleep 2
        if ! kill -0 "$pid" 2>/dev/null; then
          # Died before the check: classify by exit code, so an instant graceful release (a remote stop
          # landing within the window exits 0) is not read as a startup crash; a nonzero exit still
          # surfaces loud with the redacted log.
          code=0
          wait "$pid" 2>/dev/null || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::swoosh serve exited immediately." >&2
            sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
            exit "$code"
          fi
          echo "released early."
          exit 0
        fi
        # The node is up: settle both action outputs (the full public key and the requested service list)
        # for a later step to compose instructions or a PR comment. Outputs are public: no capability link
        # is minted or emitted here, ever.
        {
          echo "node-id=$NODE_ID"
          echo "services=$THEIA_SERVICES"
        } >> "$GITHUB_OUTPUT"
        if [ "$SELF_ROOTED" = true ]; then
          # No members to name: point at the later mint-and-publish step and this step's node-id output,
          # never at a `me/<label>` dialogue that needs a signet to exist.
          echo "node reachable over the overlay by key. no members: mint and publish a capability link from a later step (swoosh grant issue <service>); this step's node-id output carries the key."
        else
          echo "node reachable over the overlay by key. from your laptop: swoosh ssh me/<label> (or ping/speed/fetch)."
        fi
        if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
          # A persistent runner that leaves a node behind: on an adopted node `expires` bounds it. A
          # self-rooted node refuses expires, so its warning names the authkey route instead.
          if [ "$SELF_ROOTED" = true ]; then
            echo "::warning::no expires deadline is set, and self-rooted mode refuses expires: this node serves until the job ends. Set the authkey secret to adopt if you need expires to bound a node."
          else
            echo "::warning::no expires deadline is set: this node serves until the job ends; set expires (e.g. expires: 30m) to bound it."
          fi
        fi
