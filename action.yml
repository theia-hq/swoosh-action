# The flagship Action: expose a GitHub runner's shell over the theia overlay — with no SSH keys to manage.
# `uses: theia-hq/swoosh-action@v1` in any workflow, then `swoosh ssh <your-contact>` into the runner.
# The shell is a keyless SSH server (the sshh crate): it has no ssh keys of its own. The only thing that
# can open a session is the NodeId you name in `allow`, so that capability IS the authentication.
name: swoosh-ssh
description: Expose this runner's keyless shell over the theia overlay, reachable by public key across GitHub's NAT.

inputs:
  key:
    description: >
      base64 of a PRE-MINTED key file (`swoosh identity --key k.key && base64 k.key`). The runner adopts
      this identity; you saved its NodeId as a contact in advance. Pass a GitHub SECRET.
    required: true
  allow:
    description: >
      your laptop's NodeId (`swoosh identity`). REQUIRED — only this key may open a session to the runner,
      and since the shell is keyless that capability is the authentication (there is no ssh key behind it).
    required: true
  minutes:
    description: max minutes to hold the runner open. `touch $RUNNER_TEMP/theia-release` (over ssh) to end early.
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: install tightbeam (checksum-verified)
      shell: bash
      run: |
        set -euo pipefail
        # The runner only needs tightbeam (to expose the shell); swoosh is a laptop-side tool, so it is
        # not installed here. SIGNING the asset is still TODO. Always verify a checksum, never `curl | sudo`.
        os=$(uname -s | tr '[:upper:]' '[:lower:]'); case "$os" in darwin) os=macos ;; esac
        arch=$(uname -m); case "$arch" in amd64) arch=x86_64 ;; arm64) arch=aarch64 ;; esac
        asset="tightbeam-$arch-$os"
        base=https://github.com/theia-hq/tightbeam/releases/latest/download
        sudo curl -fsSL "$base/$asset" -o /usr/local/bin/tightbeam
        curl -fsSL "$base/$asset.sha256" -o /tmp/tightbeam.sha256
        echo "$(cat /tmp/tightbeam.sha256)  /usr/local/bin/tightbeam" | shasum -a 256 -c -
        sudo chmod +x /usr/local/bin/tightbeam

    - name: adopt identity and expose a keyless shell over the overlay
      shell: bash
      env:
        THEIA_KEY: ${{ inputs.key }}
        ALLOW: ${{ inputs.allow }}
      run: |
        set -euo pipefail
        if [ -z "$ALLOW" ]; then
          echo "::error::the 'allow' input is required: your laptop NodeId (swoosh identity)." >&2
          exit 1
        fi
        printf '%s' "$THEIA_KEY" | base64 -d > "$RUNNER_TEMP/runner.key"
        chmod 600 "$RUNNER_TEMP/runner.key"
        # `sshd:` is a keyless shell with no auth of its own, so it MUST be gated: --allow names the one
        # NodeId permitted to open a session. tightbeam refuses `sshd:` with --public for exactly this
        # reason. --quiet: the NodeId is NEVER printed, so it cannot leak into the (public) log by design.
        # Exposes over iroh (default): it self-publishes to discovery, reachable by key across the NAT.
        TIGHTBEAM_KEY="$RUNNER_TEMP/runner.key" \
          tightbeam expose ssh=sshd: --allow "$ALLOW" --quiet 2> "$RUNNER_TEMP/tightbeam.err" &
        echo $! > "$RUNNER_TEMP/tightbeam.pid"

    - name: hold open (liveness + early release)
      shell: bash
      env:
        MINUTES: ${{ inputs.minutes }}
      run: |
        set -uo pipefail
        pid=$(cat "$RUNNER_TEMP/tightbeam.pid")
        deadline=$(( SECONDS + MINUTES * 60 ))
        echo "reachable over the overlay. on your laptop: swoosh ssh <your-contact>"
        echo "(early release: ssh in and 'touch $RUNNER_TEMP/theia-release')"
        while [ "$SECONDS" -lt "$deadline" ]; do
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the overlay shell exited before the hold ended." >&2
            # Surface the failure WITHOUT the key: redact anything that looks like a node id.
            sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/tightbeam.err" >&2 || true
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/theia-release" ]; then echo "released early."; break; fi
          sleep 5
        done
        kill "$pid" 2>/dev/null || true
