# The flagship Action: expose a GitHub runner's shell over the theia overlay, with no SSH keys to manage.
# `uses: theia-hq/swoosh-action@v2` in any workflow, then `swoosh ssh me/<label>` into the runner.
# The shell is a keyless SSH server (the sshh crate): it has no ssh keys of its own. What authorizes a
# session is MEMBERSHIP: the runner adopts your signet, so its family gate admits your devices, and you
# dial with a badge your key self-signs. That capability IS the authentication.
name: swoosh-ssh
description: Expose this runner as a theia node (keyless shell + ping/speed by default, more on request) over the overlay, reachable by membership across GitHub's NAT.

inputs:
  authkey:
    description: >
      A one-time authkey minted on your laptop (`swoosh mint <label>`). The runner ADOPTS it to become that
      derived device identity AND to trust your signet, so your family gate admits you by membership, with
      no per-key allowlist. A SECRET (it carries the device seed): pass a GitHub secret.
    required: true
  services:
    description: >
      the services to expose, space-separated `name=target` (see `swoosh serve`). Defaults to a full node:
      a keyless shell plus `ping=ping:`/`speed=speed:` diagnostics (`ssh=sshd: ping=ping: speed=speed:`).
      Add `fetch=fetch:` for HTTP egress you can `swoosh
      fetch --via` through, `web=127.0.0.1:8080` to forward a local port, `sock=unix:/path` for a unix
      socket, all behind the same family gate. Every entry must be `name=target`: a bare `ping` or `ping:`
      is refused.
    required: false
    default: "ssh=sshd: ping=ping: speed=speed:"
  minutes:
    description: >
      hold the job open this many minutes so the node stays reachable for external or interactive use (ssh
      in, do your thing, then it stops). The node also stops itself when the deadline passes, or on a remote
      `swoosh stop`, whichever comes first. OMIT to run non-blocking: the step ends, the node stays
      reachable until the job ends, and the workflow ADVANCES to your next steps. End a hold early with
      `swoosh stop --at me/<label>` from your laptop.
    required: false
    default: ""
  version:
    # FLAG(CLI-Architect): input name `version`, values `latest` or a release tag, default `latest`.
    description: >
      the swoosh release to install: `latest` (the newest release) or a pinned release tag (e.g. `v0.8.0`).
      Pin for reproducible runs; `latest` for always-current.
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: install swoosh (checksum + provenance verified)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SWOOSH_REF: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # The runner needs only swoosh now: it `adopt`s the authkey AND serves the services (`swoosh
        # serve`), one binary, no `tightbeam` on PATH. Verify BOTH a checksum and the keyless build-provenance
        # attestation before the binary ever runs: `gh attestation verify` proves it was built by theia-hq's
        # release workflow (sigstore/OIDC), so a swapped release binary is refused. Never `curl | sudo` blind.
        # `latest` installs the newest release; a pinned tag installs that tag for reproducible runs.
        os=$(uname -s | tr '[:upper:]' '[:lower:]'); case "$os" in darwin) os=macos ;; esac
        arch=$(uname -m); case "$arch" in amd64|x86_64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
        asset="swoosh-$arch-$os"
        if [ "$SWOOSH_REF" = "latest" ]; then
          base="https://github.com/theia-hq/swoosh/releases/latest/download"
        else
          base="https://github.com/theia-hq/swoosh/releases/download/$SWOOSH_REF"
        fi
        curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/swoosh"
        curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/swoosh.sha256"
        echo "$(cat "$RUNNER_TEMP/swoosh.sha256")  $RUNNER_TEMP/swoosh" | shasum -a 256 -c -
        gh attestation verify "$RUNNER_TEMP/swoosh" --repo theia-hq/swoosh
        sudo install -m 0755 "$RUNNER_TEMP/swoosh" /usr/local/bin/swoosh

    - name: adopt your signet, serve the services, hold if asked (family-gated)
      shell: bash
      env:
        SWOOSH_AUTHKEY: ${{ inputs.authkey }}
        THEIA_SERVICES: ${{ inputs.services }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        set -euo pipefail
        # Adopt the authkey without exposing it in argv: write it to a fresh owner-only file in the runner
        # temp (umask 077 makes it 0600, the mode `@<path>` requires), unset the env var so nothing spawned
        # after it inherits the seed, adopt from `@<path>`, then remove the file at once. The EXIT trap
        # removes it on a failure path too.
        #
        # Closed: argv (`ps`, `/proc/<pid>/cmdline` see only the path) and child inheritance (the var is
        # unset before any program is spawned). Remaining: the runner still delivers this input as an env var
        # to the step (this process's environment, single-tenant), and the file exists briefly on disk, 0600.
        key="$RUNNER_TEMP/swoosh-authkey"
        trap 'rm -f "$key"' EXIT
        (umask 077 && rm -f "$key" && printf '%s' "$SWOOSH_AUTHKEY" > "$key")
        unset SWOOSH_AUTHKEY
        swoosh adopt "@$key"
        rm -f "$key"
        # Serve the requested services behind the DEFAULT family gate (rooted at the adopted signet): only
        # your devices and delegates can reach any of them, no per-key allowlist, and no --public (serve
        # refuses --public for sshd:, a keyless shell has no legitimate public use). --quiet: the readiness
        # banner (node id, services, gate) is NEVER printed, so it cannot leak into the (public) log. Serves
        # over iroh, reachable by key across the NAT.
        read -ra SERVICES <<< "$THEIA_SERVICES"
        # `0` is no hold: `Lifetime` refuses a zero span (`0m`), and the non-blocking default is what OMIT
        # already means. Normalize it away once, so `-n "$MINUTES"` alone arms both the node's own
        # `--expires` deadline and the hold loop below.
        case "$MINUTES" in "" | 0) MINUTES="" ;; esac
        SERVE_ARGS=("${SERVICES[@]}" --quiet)
        if [ -n "$MINUTES" ]; then
          # The node carries its own local deadline, so a persistent self-hosted runner cannot leave a live
          # node behind if the step is killed before the hold below ends it.
          SERVE_ARGS+=(--expires "${MINUTES}m")
        fi
        swoosh serve "${SERVE_ARGS[@]}" 2> "$RUNNER_TEMP/expose.err" &
        pid=$!
        # Fail fast: give serve a moment, then verify it is alive, so a dead node (bad authkey, gate, port)
        # surfaces HERE with the key redacted, not silently later. Without `minutes` the step ends here and
        # the backgrounded serve persists for the rest of the job (the non-blocking default); with one, the
        # hold below keeps this step alive until release.
        sleep 2
        if ! kill -0 "$pid" 2>/dev/null; then
          # Died before the check: classify by exit code the same way the hold below does, so an instant
          # graceful release (a remote stop landing within the window exits 0) is not read as a startup
          # crash; a nonzero exit still surfaces loud with the redacted log.
          code=0
          wait "$pid" 2>/dev/null || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::swoosh serve exited immediately." >&2
            sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
            exit "$code"
          fi
          echo "released early."
          exit 0
        fi
        echo "node reachable over the overlay by key. from your laptop: swoosh ssh me/<label> (or ping/speed/fetch)."
        if [ -z "$MINUTES" ]; then
          exit 0
        fi
        # Only when `minutes` is set: hold the job open. The serve above is THIS shell's child, so `wait`
        # below reaps its real exit code; a pid left behind by an earlier step cannot be waited on. A remote
        # `swoosh stop` exits 0 by design (a clean early release, not a crash); a genuine failure exits
        # nonzero and the error branch prints the redacted stderr.
        deadline=$(( SECONDS + MINUTES * 60 ))
        echo "holding open for ${MINUTES}m. early release: swoosh stop --at me/<label> from your laptop."
        while [ "$SECONDS" -lt "$deadline" ]; do
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          sleep 5
        done
        # Deadline expiry with the node still alive: SIGINT, the interrupt serve maps to exit 0 (the same
        # graceful stop Ctrl-C and `swoosh stop` take). SIGTERM has no handler and would reap as 143, which
        # would read as a crash. An early remote stop already ended the process: the kill is a no-op then.
        if kill -0 "$pid" 2>/dev/null; then
          kill -INT "$pid" 2>/dev/null || true
        fi
        code=0
        wait "$pid" 2>/dev/null || code=$?
        if [ "$code" -ne 0 ]; then
          echo "::error::the node exited before the hold ended." >&2
          sed -E 's/bf01[a-z2-7]+/bf01<redacted>/g' "$RUNNER_TEMP/expose.err" >&2 || true
          exit "$code"
        fi
        echo "released early."
