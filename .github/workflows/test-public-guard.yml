name: test-public-guard
# Run the public-input guard's decision table: which services the action will open to anyone, and which
# it refuses before `swoosh serve` binds anything. A change to the guard, or to the step that calls it,
# has to keep every line where it is.
on:
  push:
    paths:
      - action.yml
      - scripts/public-guard.sh
      - scripts/test-public-guard.rb
      - .github/workflows/test-public-guard.yml
  pull_request:
    paths:
      - action.yml
      - scripts/public-guard.sh
      - scripts/test-public-guard.rb
      - .github/workflows/test-public-guard.yml
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby scripts/test-public-guard.rb
