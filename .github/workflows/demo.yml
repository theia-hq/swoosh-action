name: swoosh-ssh-demo
# Manually-triggered demo: bring this runner up reachable by `swoosh ssh` over the theia overlay.
#
# Set on this repo first:
#   secret THEIA_KEY   base64 of a tightbeam key file (the runner's pre-minted identity)
#   variable ALLOW     your laptop's NodeId (the only key allowed to open a session; it is the auth)
# Then:  gh workflow run demo.yml   and on your laptop:  swoosh ssh <runner-NodeId>
on:
  workflow_dispatch: {}
jobs:
  debug-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          key: ${{ secrets.THEIA_KEY }}
          allow: ${{ vars.ALLOW }}
          minutes: "10"
