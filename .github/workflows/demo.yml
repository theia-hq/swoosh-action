name: swoosh-ssh-demo
# Manually-triggered demo: bring this runner up as a node reachable over the theia overlay.
#
# Set on this repo first (on your laptop):
#   swoosh invite add ci-runner              prints an invite and records the contact me/ci-runner
#   gh secret set THEIA_INVITE               paste the invite
# The runner adopts the invite: it becomes that device and trusts your signet, so its family gate
# admits your devices and delegates by membership (no per-key allowlist).
#
# Then:  gh workflow run demo.yml
# On your laptop, once the run is up:  swoosh ssh me/ci-runner
on:
  workflow_dispatch: {}
jobs:
  debug-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          invite: ${{ secrets.THEIA_INVITE }}
          expires: "10m"
